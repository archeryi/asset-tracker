<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>资产管理 - Asset Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="资产管理">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <script defer src="lib/chart.umd.min.js"></script>
    <script defer src="lib/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        /* 尽早应用主题，避免刷新时深/浅色闪烁 */
        (function () {
            try {
                var m = localStorage.getItem('asset-tracker-theme') || 'auto';
                var dark = m === 'dark' || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="app">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">◆</span>
                    <span class="logo-text">Asset Tracker</span>
                </div>
            </div>
            <ul class="nav-list">
                <li class="nav-item active" data-page="dashboard">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                    </svg>
                    <span>总览</span>
                </li>
                <li class="nav-item" data-page="snapshot">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3.5 3.5"/>
                    </svg>
                    <span>记录</span>
                </li>
                <li class="nav-item" data-page="history">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polyline points="3,17 9,11 13,15 21,7"/>
                        <polyline points="17,7 21,7 21,11"/>
                    </svg>
                    <span>趋势</span>
                </li>
                <li class="nav-item" data-page="profile">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>我的</span>
                </li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn-export" onclick="app.exportData()">导出数据</button>
                <label class="btn-import">导入数据
                    <input type="file" accept=".json" onchange="app.importData(event)" hidden>
                </label>
            </div>
        </nav>

        <main class="main-content">
            <!-- 仪表盘 -->
            <section class="page active" id="page-dashboard">
                <div class="page-title-bar">
                    <h1 class="large-title">资产总览</h1>
                    <span class="last-update" id="last-update"></span>
                </div>
                <div class="dashboard-summary">
                    <div class="summary-card total">
                        <div class="card-label">总资产 <button class="btn-eye" id="btn-eye" onclick="app.toggleHideAmounts()"><svg id="eye-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
                        <div class="card-value tappable" id="total-assets" onclick="app.toggleHideAmounts()">¥0</div>
                        <div class="card-change" id="total-change"></div>
                    </div>
                    <div class="summary-card">
                        <div class="card-label">本月变化</div>
                        <div class="card-value" id="month-change">¥0</div>
                        <div class="card-change" id="month-change-pct"></div>
                    </div>
                    <div class="summary-card">
                        <div class="card-label">年度收益</div>
                        <div class="card-value" id="year-change">¥0</div>
                        <div class="card-change" id="year-change-pct"></div>
                    </div>
                    <div class="summary-card trend-summary-card">
                        <div class="card-label">趋势</div>
                        <div class="trend-summary-text" id="trend-summary">暂无数据</div>
                    </div>
                </div>
                <div class="dashboard-charts">
                    <div class="chart-container">
                        <h3>资产趋势</h3>
                        <canvas id="chart-trend"></canvas>
                    </div>
                    <div class="chart-container full allocation-card">
                        <div class="allocation-head">
                            <h3>资产分布</h3>
                            <div class="seg-control">
                                <button class="seg-btn active" data-view="category" onclick="app.switchAllocationView('category')">按类别</button>
                                <button class="seg-btn" data-view="account" onclick="app.switchAllocationView('account')">按账户</button>
                            </div>
                        </div>
                        <div class="allocation-view active" id="view-category">
                            <canvas id="chart-allocation"></canvas>
                            <div class="chart-legend" id="legend-allocation"></div>
                        </div>
                        <div class="allocation-view" id="view-account">
                            <canvas id="chart-account-allocation"></canvas>
                            <div class="chart-legend" id="legend-account-allocation"></div>
                        </div>
                    </div>
                    <div class="chart-container full">
                        <h3>各类别资产</h3>
                        <div class="category-list" id="category-list"></div>
                    </div>
                </div>
            </section>

            <!-- 记录快照 -->
            <section class="page" id="page-snapshot">
                <div class="page-title-bar">
                    <h1 class="large-title">记录快照</h1>
                </div>
                <div class="snapshot-form">
                    <div class="ios-group">
                        <div class="ios-row">
                            <span class="ios-row-label">记录日期</span>
                            <input type="date" id="snapshot-date" class="ios-row-value" onchange="app.renderSnapshotForm()">
                        </div>
                    </div>
                    <div id="snapshot-accounts"></div>
                    <div class="snapshot-save-bar">
                        <button class="btn-save-snapshot" onclick="app.saveSnapshot()">保存快照</button>
                    </div>
                </div>
            </section>

            <!-- 历史趋势 -->
            <section class="page" id="page-history">
                <div class="page-title-bar">
                    <h1 class="large-title">历史趋势</h1>
                    <select id="history-range" class="ios-select" onchange="app.updateHistoryChart()">
                        <option value="3">近3月</option>
                        <option value="6" selected>近6月</option>
                        <option value="12">近1年</option>
                        <option value="0">全部</option>
                    </select>
                </div>
                <div class="chart-container full">
                    <div class="period-stats" id="period-stats"></div>
                    <canvas id="chart-history"></canvas>
                </div>
                <div class="ios-group" style="margin-top:20px" id="category-rank-group">
                    <div class="ios-group-header">各类别变化</div>
                    <div id="category-rank"></div>
                </div>
                <div class="ios-group" style="margin-top:20px" id="account-rank-group">
                    <div class="ios-group-header">各账户变化</div>
                    <div id="account-rank"></div>
                </div>
                <div class="ios-group" style="margin-top:20px">
                    <div class="ios-group-header">快照记录 <span style="font-size:11px;text-transform:none;letter-spacing:0">(点击展开明细)</span></div>
                    <div id="history-list"></div>
                </div>
            </section>

            <!-- 我的（账户+设置合并） -->
            <section class="page" id="page-profile">
                <div class="page-title-bar">
                    <h1 class="large-title">我的</h1>
                    <button class="btn-primary" onclick="app.showAddAccount()">+ 账户</button>
                </div>

                <!-- 外观 -->
                <div class="ios-group-header-outside">外观</div>
                <div class="ios-group">
                    <div class="ios-row" style="flex-direction:column;align-items:stretch;gap:10px">
                        <span class="ios-row-label">主题</span>
                        <div class="seg-control theme-seg" id="theme-seg">
                            <button class="seg-btn" data-theme-opt="auto" onclick="app.setTheme('auto')">跟随系统</button>
                            <button class="seg-btn" data-theme-opt="light" onclick="app.setTheme('light')">浅色</button>
                            <button class="seg-btn" data-theme-opt="dark" onclick="app.setTheme('dark')">深色</button>
                        </div>
                    </div>
                </div>

                <!-- 账户列表 -->
                <div class="ios-group-header-outside">资产账户</div>
                <div class="accounts-list" id="accounts-list"></div>

                <!-- 类别管理 -->
                <div class="ios-group">
                    <div class="ios-group-header">资产类别</div>
                    <div id="category-manager"></div>
                    <div class="ios-row ios-row-action" onclick="app.showAddCategory()">
                        <span style="color:var(--accent)">+ 添加类别</span>
                    </div>
                </div>

                <!-- 数据管理 -->
                <div class="ios-group">
                    <div class="ios-group-header">数据管理</div>
                    <div class="ios-row ios-row-action" onclick="app.exportData()">
                        <span>备份数据</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
                    </div>
                    <label class="ios-row ios-row-action">
                        <span>恢复数据</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
                        <input type="file" accept=".json" onchange="app.importData(event)" hidden>
                    </label>
                    <div class="ios-row ios-row-action ios-row-danger" onclick="app.clearData()">
                        <span>清除所有数据</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Bottom Sheet -->
    <div class="sheet-overlay" id="sheet-overlay">
        <div class="sheet" id="sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2 id="sheet-title"></h2>
                <button class="sheet-close" onclick="app.closeSheet()">完成</button>
            </div>
            <div class="sheet-body" id="sheet-body"></div>
        </div>
    </div>

    <!-- Action Sheet -->
    <div class="action-sheet-overlay" id="action-sheet-overlay">
        <div class="action-sheet" id="action-sheet"></div>
    </div>

    <script defer src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newSW = reg.installing;
                    newSW.addEventListener('statechange', () => {
                        if (newSW.state === 'activated') window.location.reload();
                    });
                });
            }).catch(() => {});
        }
    </script>
</body>
</html>
