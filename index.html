<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>资产管理 - Asset Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="资产管理">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 (桌面) / 底部 Tab Bar (移动) -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">◆</span>
                    <span class="logo-text">Asset Tracker</span>
                </div>
            </div>
            <ul class="nav-list">
                <li class="nav-item active" data-page="dashboard">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                    </svg>
                    <span>总览</span>
                </li>
                <li class="nav-item" data-page="accounts">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="2" y="5" width="20" height="14" rx="3"/>
                        <path d="M2 10h20"/>
                    </svg>
                    <span>账户</span>
                </li>
                <li class="nav-item" data-page="snapshot">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3.5 3.5"/>
                    </svg>
                    <span>记录</span>
                </li>
                <li class="nav-item" data-page="history">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polyline points="3,17 9,11 13,15 21,7"/>
                        <polyline points="17,7 21,7 21,11"/>
                    </svg>
                    <span>趋势</span>
                </li>
                <li class="nav-item" data-page="settings">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                    <span>设置</span>
                </li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn-export" onclick="app.exportData()">导出数据</button>
                <label class="btn-import">导入数据
                    <input type="file" accept=".json" onchange="app.importData(event)" hidden>
                </label>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 仪表盘 -->
            <section class="page active" id="page-dashboard">
                <div class="page-title-bar">
                    <h1 class="large-title">资产总览</h1>
                    <span class="last-update" id="last-update"></span>
                </div>
                <div class="dashboard-summary">
                    <div class="summary-card total">
                        <div class="card-label">总资产</div>
                        <div class="card-value" id="total-assets">¥0</div>
                        <div class="card-change" id="total-change"></div>
                    </div>
                    <div class="summary-card">
                        <div class="card-label">本月变化</div>
                        <div class="card-value" id="month-change">¥0</div>
                        <div class="card-change" id="month-change-pct"></div>
                    </div>
                    <div class="summary-card">
                        <div class="card-label">账户数量</div>
                        <div class="card-value" id="account-count">0</div>
                    </div>
                    <div class="summary-card">
                        <div class="card-label">资产类别</div>
                        <div class="card-value" id="category-count">0</div>
                    </div>
                </div>
                <div class="dashboard-charts">
                    <div class="chart-container">
                        <h3>资产趋势</h3>
                        <canvas id="chart-trend"></canvas>
                    </div>
                    <div class="chart-container half">
                        <h3>资产配置</h3>
                        <canvas id="chart-allocation"></canvas>
                    </div>
                    <div class="chart-container half">
                        <h3>各类别资产</h3>
                        <div class="category-list" id="category-list"></div>
                    </div>
                </div>
            </section>

            <!-- 账户管理 -->
            <section class="page" id="page-accounts">
                <div class="page-title-bar">
                    <h1 class="large-title">账户管理</h1>
                    <button class="btn-primary" onclick="app.showAddAccount()">+ 添加</button>
                </div>
                <div class="accounts-list" id="accounts-list"></div>
            </section>

            <!-- 记录快照 -->
            <section class="page" id="page-snapshot">
                <div class="page-title-bar">
                    <h1 class="large-title">记录快照</h1>
                    <button class="btn-primary" onclick="app.saveSnapshot()">保存</button>
                </div>
                <div class="snapshot-form">
                    <div class="ios-group">
                        <div class="ios-row">
                            <span class="ios-row-label">记录日期</span>
                            <input type="date" id="snapshot-date" class="ios-row-value">
                        </div>
                    </div>
                    <div id="snapshot-accounts"></div>
                </div>
            </section>

            <!-- 历史趋势 -->
            <section class="page" id="page-history">
                <div class="page-title-bar">
                    <h1 class="large-title">历史趋势</h1>
                    <select id="history-range" class="ios-select" onchange="app.updateHistoryChart()">
                        <option value="3">近3月</option>
                        <option value="6" selected>近6月</option>
                        <option value="12">近1年</option>
                        <option value="0">全部</option>
                    </select>
                </div>
                <div class="chart-container full">
                    <canvas id="chart-history"></canvas>
                </div>
                <div class="ios-group" style="margin-top:20px">
                    <div class="ios-group-header">快照记录</div>
                    <div id="history-list"></div>
                </div>
            </section>

            <!-- 设置 -->
            <section class="page" id="page-settings">
                <div class="page-title-bar">
                    <h1 class="large-title">设置</h1>
                </div>
                <div class="settings-content">
                    <div class="ios-group">
                        <div class="ios-group-header">资产类别</div>
                        <div id="category-manager"></div>
                        <div class="ios-row ios-row-action" onclick="app.showAddCategory()">
                            <span style="color:var(--accent)">+ 添加类别</span>
                        </div>
                    </div>
                    <div class="ios-group">
                        <div class="ios-group-header">数据管理</div>
                        <div class="ios-row ios-row-action" onclick="app.exportData()">
                            <span>导出 JSON 备份</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
                        </div>
                        <label class="ios-row ios-row-action">
                            <span>导入 JSON 数据</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
                            <input type="file" accept=".json" onchange="app.importData(event)" hidden>
                        </label>
                        <div class="ios-row ios-row-action ios-row-danger" onclick="app.clearData()">
                            <span>清除所有数据</span>
                        </div>
                    </div>
                    <div class="ios-group">
                        <div class="ios-group-header">使用说明</div>
                        <div class="ios-row-static">
                            <p>1. 在「账户」中添加你的各类资产账户</p>
                            <p>2. 定期在「记录」中填入各账户当前余额</p>
                            <p>3. 在「总览」和「趋势」中查看资产变化</p>
                            <p>4. 导出 JSON 文件存放在 iCloud Drive 可跨设备同步</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Bottom Sheet 模态框 -->
    <div class="sheet-overlay" id="sheet-overlay">
        <div class="sheet" id="sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2 id="sheet-title"></h2>
                <button class="sheet-close" onclick="app.closeSheet()">完成</button>
            </div>
            <div class="sheet-body" id="sheet-body"></div>
        </div>
    </div>

    <!-- Action Sheet -->
    <div class="action-sheet-overlay" id="action-sheet-overlay">
        <div class="action-sheet" id="action-sheet"></div>
    </div>

    <script src="app.js"></script>
    <script>
        // 注销旧 SW 并清除所有缓存（彻底解决 PWA 缓存锁死）
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
                regs.forEach(r => r.unregister());
            });
            if (window.caches) {
                caches.keys().then(names => names.forEach(n => caches.delete(n)));
            }
        }
    </script>
</body>
</html>
